name = "asphalt-outlaws"
main = "worker.js"
compatibility_date = "2025-06-01"

# Importa o index.html como texto dentro do Worker (um único deploy publica jogo + multiplayer)
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

# Durable Object: guarda todas as salas/jogadores em tempo real
[[durable_objects.bindings]]
name = "GAME_HUB"
class_name = "GameHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameHub"]

# Variáveis PÚBLICAS (a chave "publishable" já está no seu index.html). NÃO coloque a service_role aqui!
